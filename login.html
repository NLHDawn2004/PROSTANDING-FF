<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · FF Standings</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#15233b;font-family:Arial,sans-serif;padding:24px}.card{width:100%;max-width:420px;padding:40px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 16px 50px #15233b0c}.brand{font-size:12px;letter-spacing:2px;color:#2563eb;font-weight:700}h1{font-size:28px;margin:18px 0 10px}p{font-size:14px;color:#64748b;line-height:1.5}label{display:block;font-size:14px;font-weight:600;margin:22px 0 8px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}input:focus{outline:2px solid #93b4ff;border-color:#2563eb}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#error{color:#b42318;min-height:20px;font-size:14px;margin-top:14px}</style>
<main class="card"><div class="brand">FF STANDINGS</div><h1>Đăng nhập</h1><p>Nhập tài khoản để mở bảng điều khiển.</p><form id="login"><label for="username">Tài khoản</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button>Đăng nhập</button><div id="error" role="alert"></div></form></main>
<script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('button'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Không thể đăng nhập.');location.replace('/');}catch(e){error.textContent=e.message;}finally{button.disabled=false;}});</script></html>
